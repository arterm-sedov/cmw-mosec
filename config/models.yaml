# Server configuration for cmw-mosec package
# Model specifications for embedding, reranker, and guard models.
# Server port is configured in .env (SERVER_PORT), not here.
#
# All models run on a single server with different endpoints:
#   - /v1/embeddings → Embedding model
#   - /v1/rerank     → Reranker model
#   - /v1/moderate   → Guard model

################################################################################
# EMBEDDING MODELS
# API: OpenAI-compatible /v1/embeddings
################################################################################

embedding_models:
  # FRIDA - Russian embedding model (1536 dim, 32K context)
  # Uses search_query: and search_document: prefixes per HuggingFace docs
  ai-forever/FRIDA:
    model_id: ai-forever/FRIDA
    dtype: float16
    batch_size: 16
    memory_gb: 4.0
    workers: 1
    dimensions: 1536
    query_prefix: "search_query: "
    doc_prefix: "search_document: "
    description: "Russian-optimized embedding, 1536 dimensions"

  # Qwen3 Embedding Series (multilingual, 119+ languages)
  Qwen/Qwen3-Embedding-0.6B:
    model_id: Qwen/Qwen3-Embedding-0.6B
    dtype: float16
    batch_size: 16
    memory_gb: 2.0
    workers: 1
    description: "0.6B params, 1024 dim, 32K context, MRL support"

  Qwen/Qwen3-Embedding-4B:
    model_id: Qwen/Qwen3-Embedding-4B
    dtype: float16
    batch_size: 16
    memory_gb: 12.0
    workers: 1
    description: "4B params, 2560 dim, 32K context, MRL support"

  Qwen/Qwen3-Embedding-8B:
    model_id: Qwen/Qwen3-Embedding-8B
    dtype: float16
    batch_size: 8
    memory_gb: 22.0
    workers: 1
    description: "8B params, 4096 dim, 32K context, MRL support"

################################################################################
# RERANKER MODELS
# API: OpenAI-compatible /v1/rerank
################################################################################

reranker_models:
  # DiTy CrossEncoder - Russian optimized
  DiTy/cross-encoder-russian-msmarco:
    model_id: DiTy/cross-encoder-russian-msmarco
    dtype: float16
    batch_size: 32
    memory_gb: 2.0
    workers: 1
    description: "Russian-optimized cross-encoder reranker"

  # BGE Reranker - Multilingual
  BAAI/bge-reranker-v2-m3:
    model_id: BAAI/bge-reranker-v2-m3
    dtype: float16
    batch_size: 32
    memory_gb: 2.0
    workers: 1
    description: "Multilingual reranker based on BGE-M3"

  # Qwen3 Reranker Series (multilingual, 119+ languages)
  Qwen/Qwen3-Reranker-0.6B:
    model_id: Qwen/Qwen3-Reranker-0.6B
    dtype: float16
    batch_size: 32
    memory_gb: 2.0
    workers: 1
    description: "0.6B params, instruction-aware reranking"

  Qwen/Qwen3-Reranker-4B:
    model_id: Qwen/Qwen3-Reranker-4B
    dtype: float16
    batch_size: 16
    memory_gb: 12.0
    workers: 1
    description: "4B params, instruction-aware reranking"

  Qwen/Qwen3-Reranker-8B:
    model_id: Qwen/Qwen3-Reranker-8B
    dtype: float16
    batch_size: 8
    memory_gb: 22.0
    workers: 1
    description: "8B params, instruction-aware reranking"

################################################################################
# GUARD MODELS
# API: OpenAI-compatible /v1/moderate
# Output format: Safety: Safe|Controversial|Unsafe, Categories: ..., Refusal: Yes|No
################################################################################

guard_models:
  # Qwen3Guard Series - Content safety moderation
  # Three-tier classification: Safe, Controversial, Unsafe
  # Safety categories: Violent, Non-violent Illegal Acts, Sexual Content,
  #                   PII, Suicide & Self-Harm, Unethical Acts,
  #                   Politically Sensitive Topics, Copyright Violation, Jailbreak

  Qwen/Qwen3Guard-Gen-0.6B:
    model_id: Qwen/Qwen3Guard-Gen-0.6B
    dtype: bf16
    batch_size: 4
    memory_gb: 4.0
    workers: 1
    max_new_tokens: 128
    transformers_min_version: "4.51.0"
    description: "0.6B params, 119 languages, generative guard"

  Qwen/Qwen3Guard-Gen-4B:
    model_id: Qwen/Qwen3Guard-Gen-4B
    dtype: bf16
    batch_size: 4
    memory_gb: 10.0
    workers: 1
    max_new_tokens: 128
    transformers_min_version: "4.51.0"
    description: "4B params, 119 languages, generative guard"

  Qwen/Qwen3Guard-Gen-8B:
    model_id: Qwen/Qwen3Guard-Gen-8B
    dtype: bf16
    batch_size: 2
    memory_gb: 20.0
    workers: 1
    max_new_tokens: 128
    transformers_min_version: "4.51.0"
    description: "8B params, 119 languages, generative guard"
