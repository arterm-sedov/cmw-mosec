# Server configuration for cmw-mosec package
# Model specifications for embedding, reranker, and guard models.
# Server port is configured in .env (SERVER_PORT), not here.
#
# All models run on a single server with different endpoints:
#   - /v1/embeddings → Embedding model
#   - /v1/rerank     → Reranker model
#   - /v1/moderate   → Guard model

################################################################################
# EMBEDDING MODELS
# API: OpenAI-compatible /v1/embeddings
################################################################################

embedding_models:
  # FRIDA - Russian embedding model (1536 dim, 32K context)
  # Uses search_query: and search_document: prefixes per HuggingFace docs
  ai-forever/FRIDA:
    model_id: ai-forever/FRIDA
    dtype: float32  # FRIDA requires float32
    batch_size: 16
    memory_gb: 4.0
    workers: 1
    dimensions: 1536
    model_class: T5EncoderModel  # T5-based model needs encoder-only
    query_prefix: "search_query: "
    doc_prefix: "search_document: "
    pooling: cls  # T5-based model requires CLS pooling
    description: "Russian-optimized embedding, 1536 dimensions"

  # Qwen3 Embedding Series (multilingual, 119+ languages)
  # Supports OpenAI-compatible /v1/embeddings API with dimensions parameter for MRL
  Qwen/Qwen3-Embedding-0.6B:
    model_id: Qwen/Qwen3-Embedding-0.6B
    dtype: float16
    batch_size: 16
    memory_gb: 2.0
    workers: 1
    dimensions: 1024
    max_length: 32768
    pooling: last_token  # Required for Qwen3 causal LM architecture
    description: "0.6B params, 32K context, MRL: dimensions=[32-1024]"

  Qwen/Qwen3-Embedding-4B:
    model_id: Qwen/Qwen3-Embedding-4B
    dtype: float16
    batch_size: 16
    memory_gb: 12.0
    workers: 1
    dimensions: 2560
    max_length: 32768
    pooling: last_token  # Required for Qwen3 causal LM architecture
    description: "4B params, 32K context, MRL: dimensions=[32-2560]"

  Qwen/Qwen3-Embedding-8B:
    model_id: Qwen/Qwen3-Embedding-8B
    dtype: float16
    batch_size: 8
    memory_gb: 22.0
    workers: 1
    dimensions: 4096
    max_length: 32768
    pooling: last_token  # Required for Qwen3 causal LM architecture
    description: "8B params, 32K context, MRL: dimensions=[32-4096]"

################################################################################
# RERANKER MODELS
# API: OpenAI-compatible /v1/rerank
################################################################################

reranker_models:
  # DiTy CrossEncoder - Russian optimized
  DiTy/cross-encoder-russian-msmarco:
    model_id: DiTy/cross-encoder-russian-msmarco
    reranker_type: cross_encoder
    dtype: float16
    batch_size: 32
    memory_gb: 2.0
    workers: 1
    max_length: 512
    description: "Russian-optimized cross-encoder reranker"

  # BGE Reranker - Multilingual
  BAAI/bge-reranker-v2-m3:
    model_id: BAAI/bge-reranker-v2-m3
    reranker_type: cross_encoder
    dtype: float16
    batch_size: 32
    memory_gb: 2.0
    workers: 1
    max_length: 8192
    description: "Multilingual reranker based on BGE-M3"

  # BGE-Gemma (LLM-based reranker using raw logit scoring)
  # Client MUST format query as "A: {query}" and documents as "B: {doc}\n{prompt}"
  BAAI/bge-reranker-v2-gemma:
    model_id: BAAI/bge-reranker-v2-gemma
    reranker_type: llm_reranker
    scoring_method: raw_logit
    scoring_tokens:
      "true": "Yes"
    dtype: float16
    batch_size: 16
    memory_gb: 8.0
    workers: 1
    max_length: 1024
    description: "LLM reranker using Yes logit scoring"

  # Qwen3 Reranker Series (multilingual, 119+ languages)
  # LLM-based reranker using yes/no softmax scoring
  # Client MUST format query/documents with ChatML prefix/suffix before sending
  Qwen/Qwen3-Reranker-0.6B:
    model_id: Qwen/Qwen3-Reranker-0.6B
    reranker_type: llm_reranker
    scoring_method: softmax
    scoring_tokens:
      "true": "yes"
      "false": "no"
    dtype: float16
    batch_size: 32
    memory_gb: 2.0
    workers: 1
    max_length: 32768
    description: "0.6B params, requires client-side ChatML formatting"

  Qwen/Qwen3-Reranker-4B:
    model_id: Qwen/Qwen3-Reranker-4B
    reranker_type: llm_reranker
    scoring_method: softmax
    scoring_tokens:
      "true": "yes"
      "false": "no"
    dtype: float16
    batch_size: 16
    memory_gb: 12.0
    workers: 1
    max_length: 32768
    description: "4B params, requires client-side ChatML formatting"

  Qwen/Qwen3-Reranker-8B:
    model_id: Qwen/Qwen3-Reranker-8B
    reranker_type: llm_reranker
    scoring_method: softmax
    scoring_tokens:
      "true": "yes"
      "false": "no"
    dtype: float16
    batch_size: 8
    memory_gb: 22.0
    workers: 1
    max_length: 32768
    description: "8B params, requires client-side ChatML formatting"

################################################################################
# GUARD MODELS
# API: OpenAI-compatible /v1/moderate
# Output format: Safety: Safe|Controversial|Unsafe, Categories: ..., Refusal: Yes|No
################################################################################

guard_models:
  # Qwen3Guard Series - Content safety moderation
  # Three-tier classification: Safe, Controversial, Unsafe
  # Safety categories: Violent, Non-violent Illegal Acts, Sexual Content,
  #                   PII, Suicide & Self-Harm, Unethical Acts,
  #                   Politically Sensitive Topics, Copyright Violation, Jailbreak

  Qwen/Qwen3Guard-Gen-0.6B:
    model_id: Qwen/Qwen3Guard-Gen-0.6B
    dtype: bf16
    batch_size: 4
    memory_gb: 4.0
    workers: 1
    max_new_tokens: 128
    transformers_min_version: "4.51.0"
    description: "0.6B params, 119 languages, generative guard"

  Qwen/Qwen3Guard-Gen-4B:
    model_id: Qwen/Qwen3Guard-Gen-4B
    dtype: bf16
    batch_size: 4
    memory_gb: 10.0
    workers: 1
    max_new_tokens: 128
    transformers_min_version: "4.51.0"
    description: "4B params, 119 languages, generative guard"

  Qwen/Qwen3Guard-Gen-8B:
    model_id: Qwen/Qwen3Guard-Gen-8B
    dtype: bf16
    batch_size: 2
    memory_gb: 20.0
    workers: 1
    max_new_tokens: 128
    transformers_min_version: "4.51.0"
    description: "8B params, 119 languages, generative guard"
